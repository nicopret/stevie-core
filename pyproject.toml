[project]
name = "stevie"
version = "0.1.0"
description = "The home media orchestration platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
    "uvicorn>=0.50.2",
    "websockets>=16.0",
]

[project.scripts]
stevie = "stevie:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
